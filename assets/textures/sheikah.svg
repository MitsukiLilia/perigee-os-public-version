<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- 希卡之眼 Sheikah eye — 青蓝淡描边，大间距 tile，深色底上若隐若现 -->
  <g fill="none" stroke="#3CD3FC" stroke-opacity="0.40" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- 眼形（橄榄/杏仁，左右尖） -->
    <path d="M72 128 Q128 92 184 128 Q128 164 72 128 Z"/>
    <!-- 虹膜 -->
    <circle cx="128" cy="128" r="17"/>
    <!-- 三条睫毛（眼上方放射） -->
    <path d="M128 108 L128 66"/>
    <path d="M104 112 Q94 86 88 76"/>
    <path d="M152 112 Q162 86 168 76"/>
    <!-- 泪滴（眼下方） -->
    <path d="M128 150 C119 162 119 176 128 179 C137 176 137 162 128 150 Z"/>
  </g>
  <!-- 瞳孔实心点 -->
  <circle cx="128" cy="128" r="6" fill="#3CD3FC" fill-opacity="0.38"/>
</svg>
